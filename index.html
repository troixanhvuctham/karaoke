<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hát Karaoke</title>
<style>
  :root { --bg:#111; --fg:#fff; --muted:#9a9a9a; --card:#1e1e1e; --accent:#ff2d55; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:6vh 16px; }
  h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin:0 0 .3em; }
  h1 span { color:var(--accent); }
  form { width:100%; max-width:720px; display:flex; gap:10px; }
  input { flex:1; min-width:0; font-size:1.5rem; padding:.7em .9em; border-radius:14px;
          border:2px solid #333; background:var(--card); color:var(--fg); outline:none; }
  input:focus { border-color:var(--accent); }
  button { font-size:1.3rem; padding:0 1.1em; border:0; border-radius:14px; cursor:pointer;
           background:var(--accent); color:#fff; font-weight:600; }
  .tones { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:16px 0 0; }
  .tones label { cursor:pointer; }
  .tones input { display:none; }
  .tones span { display:inline-block; padding:.45em 1em; border-radius:999px; background:var(--card);
                border:1px solid #333; font-size:1.05rem; }
  .tones input:checked + span { background:var(--accent); border-color:var(--accent); }
  section { width:100%; max-width:720px; margin-top:32px; }
  section h2 { font-size:1rem; color:var(--muted); font-weight:500; display:flex; justify-content:space-between; }
  section h2 a { color:var(--muted); cursor:pointer; font-size:.9rem; }
  .list { display:flex; flex-wrap:wrap; gap:8px; }
  .list button { background:var(--card); border:1px solid #333; font-size:1.05rem; font-weight:400;
                 padding:.55em 1em; }
  .list button:hover { border-color:var(--accent); }
  .hint { color:var(--muted); font-size:.9rem; margin-top:40px; text-align:center; }
</style>
</head>
<body>
  <h1>🎤 Hát <span>Karaoke</span></h1>

  <form id="f">
    <input id="q" autofocus autocomplete="off" placeholder="Nhập tên bài hát...">
    <button type="submit">Tìm</button>
  </form>

  <div class="tones">
    <label><input type="radio" name="tone" value="" checked><span>Tất cả</span></label>
    <label><input type="radio" name="tone" value="tone nam"><span>Tone nam</span></label>
    <label><input type="radio" name="tone" value="tone nữ"><span>Tone nữ</span></label>
    <label><input type="radio" name="tone" value="song ca"><span>Song ca</span></label>
    <label><input type="radio" name="tone" value="beat"><span>Beat</span></label>
  </div>

  <section id="recentBox" hidden>
    <h2>Đã tìm gần đây <a id="clear">Xoá</a></h2>
    <div class="list" id="recent"></div>
  </section>

  <section>
    <h2>Gợi ý</h2>
    <div class="list" id="popular"></div>
  </section>

  <p class="hint">Gõ tên bài rồi nhấn Enter — YouTube sẽ mở sẵn kết quả karaoke.</p>

<script>
  const POPULAR = ["Nối vòng tay lớn", "Hãy về đây bên anh", "Người hãy quên em đi", "Diễm xưa",
    "Lạc trôi", "Em của ngày hôm qua", "Duyên phận", "Sầu tím thiệp hồng", "Đừng hỏi em",
    "Bèo dạt mây trôi", "Chắc ai đó sẽ về", "Để Mị nói cho mà nghe"];
  const KEY = "karaoke_recent";
  const $ = id => document.getElementById(id);

  function loadRecent() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
  function saveRecent(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {} }

  function sing(song) {
    song = song.trim();
    if (!song) return;
    const recent = [song, ...loadRecent().filter(s => s.toLowerCase() !== song.toLowerCase())].slice(0, 12);
    saveRecent(recent);
    renderRecent();
    const tone = document.querySelector('input[name=tone]:checked').value;
    const query = `${song} karaoke ${tone}`.trim();
    window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(query), "_blank");
    $("q").value = "";
    $("q").focus();
  }

  function chips(el, items) {
    el.innerHTML = "";
    items.forEach(s => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = s;
      b.onclick = () => sing(s);
      el.appendChild(b);
    });
  }

  function renderRecent() {
    const recent = loadRecent();
    $("recentBox").hidden = recent.length === 0;
    chips($("recent"), recent);
  }

  $("f").onsubmit = e => { e.preventDefault(); sing($("q").value); };
  $("clear").onclick = () => { saveRecent([]); renderRecent(); };
  chips($("popular"), POPULAR);
  renderRecent();
</script>
</body>
</html>
